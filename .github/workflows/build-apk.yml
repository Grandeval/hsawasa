name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout source
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # INI KUNCI RAHASIANYA: Menyimpan keystore agar signature APK selalu sama
      - name: 5. Cache Android Debug Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: 6. Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: 7. Add Android platform
        run: npx cap add android

      - name: 8. Patch AndroidManifest.xml
        run: node patch.js

      - name: 9. Capacitor sync
        run: npx cap sync android

      - name: 10. Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 11. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ojolku-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
