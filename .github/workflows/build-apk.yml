name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout source
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: 6. Add Android platform
        run: npx cap add android

      - name: 7. Patch AndroidManifest.xml (izin lokasi + foreground service)
        run: |
          node -e "
          const fs = require('fs');
          const path = 'android/app/src/main/AndroidManifest.xml';
          let content = fs.readFileSync(path, 'utf8');
          const perms = \`
              <uses-permission android:name=\\\"android.permission.ACCESS_FINE_LOCATION\\\" />
              <uses-permission android:name=\\\"android.permission.ACCESS_COARSE_LOCATION\\\" />
              <uses-permission android:name=\\\"android.permission.ACCESS_BACKGROUND_LOCATION\\\" />
              <uses-permission android:name=\\\"android.permission.FOREGROUND_SERVICE\\\" />
              <uses-permission android:name=\\\"android.permission.FOREGROUND_SERVICE_LOCATION\\\" />
              <uses-permission android:name=\\\"android.permission.POST_NOTIFICATIONS\\\" />
              <uses-permission android:name=\\\"android.permission.WAKE_LOCK\\\" />
          \`;
          if (!content.includes('ACCESS_BACKGROUND_LOCATION')) {
            content = content.replace('</manifest>', perms + '</manifest>');
            fs.writeFileSync(path, content);
            console.log('✅ Izin berhasil ditambahkan ke AndroidManifest.xml');
          } else {
            console.log('ℹ️ Izin sudah ada, skip patch');
          }
          console.log('--- Isi AndroidManifest.xml ---');
          console.log(content);
          "

      - name: 8. Capacitor sync
        run: npx cap sync android

      - name: 9. Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 10. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ojolku-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
